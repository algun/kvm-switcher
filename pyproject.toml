[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kvm-switcher"
description = "Watch USB devices and switch the monitor input when one of them appears."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "kvm-switcher contributors" }]
keywords = ["kvm", "monitor", "ddc", "mccs", "usb"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "kvm_switcher.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
