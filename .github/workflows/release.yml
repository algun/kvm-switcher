name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Test
        run: python3 -m pytest -q

      # The tag and the source must agree before anything is built. build.py
      # reads __version__ out of the built archive, so this checks the artifact a
      # user downloads rather than a regex over the source.
      - name: Build zipapp and check the tag matches __version__
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          python3 build.py --output dist/kvm-switcher.pyz --expect-version "$tag_ver"

      - name: Check the archive runs
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          built=$(python3 dist/kvm-switcher.pyz version)
          echo "archive reports: $built"
          test "$built" = "$tag_ver"

      - name: Pack
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist/kvm-switcher
          cp dist/kvm-switcher.pyz config.json dist/kvm-switcher/
          cp *.sh *.ps1 build.py dist/kvm-switcher/
          tar -C dist -czf dist/kvm-switcher.tar.gz kvm-switcher
          tar -C dist -czf "dist/kvm-switcher-${ver}.tar.gz" kvm-switcher
          (cd dist && zip -r "kvm-switcher-${ver}.zip" kvm-switcher)
          cp "dist/kvm-switcher-${ver}.zip" dist/kvm-switcher.zip

      # The installers and the seed config are published as their own assets so
      # the documented one-liner can fetch them from the newest release instead
      # of a branch: what a user runs is then exactly what was tagged and tested.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "kvm-switcher ${ver}" \
            dist/kvm-switcher.pyz \
            install.sh \
            install.ps1 \
            config.json \
            dist/kvm-switcher.tar.gz \
            dist/kvm-switcher.zip \
            "dist/kvm-switcher-${ver}.tar.gz" \
            "dist/kvm-switcher-${ver}.zip"
